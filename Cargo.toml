[package]
name = "queryx"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "=0.7.0", features = ["tree-sitter-sql"] }

[dev-dependencies]
gpui-kit = { version = "=0.7.0", features = ["tree-sitter-sql", "test-support"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
