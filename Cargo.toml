[package]
name = "tablex"
version = "0.1.6"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Database client"

[dependencies]
# The date pickers in gpui-component speak chrono; it is already in the tree through them.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# JSON cells are checked before they are saved; already in the tree through gpui.
serde_json = "1"
# workspaces.toml and the other config files (src/persist).
serde = { version = "1", features = ["derive"] }
toml = "1"
gpui-kit = { version = "=0.7.0", features = ["tree-sitter-sql"] }
# Database IO (src/db): one tokio runtime runs every session (docs/adr/0001).
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-postgres = "0.7"
rusqlite = { version = "0.37", features = ["bundled", "column_decltype"] }
futures = "0.3"
# Console completion items (src/ui/console/completion.rs); the editor's own version, already in the tree.
lsp-types = "=0.97.0"
# Raw cell bytes sent back for the server's text form; already in the tree through tokio-postgres.
bytes = "1"
# TLS for Postgres on ring only; default features would pull in aws-lc-rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Saved passwords (C5): the OS keychain only, no bundled crypto or async runtime.
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "apple-native", "windows-native"] }

# Embeds assets/icons/app/tablex.ico in the Windows exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
gpui-kit = { version = "=0.7.0", features = ["tree-sitter-sql", "test-support"] }

# macOS .app bundle (cargo bundle).
[package.metadata.bundle]
name = "TableX"
identifier = "dev.tablex.TableX"
icon = ["assets/icons/app/tablex.icns"]

# Debian package (cargo deb), built in CI.
[package.metadata.deb]
maintainer = "Satbeer Singh <32334303+0xSatbeer@users.noreply.github.com>"
section = "database"
# renamed from queryx; same desktop file and icons, so the old package must make way
conflicts = "queryx"
replaces = "queryx"
assets = [
    ["target/release/tablex", "usr/bin/", "755"],
    ["assets/icons/app/io.github.TableX.desktop", "usr/share/applications/", "644"],
    ["assets/icons/app/io.github.TableX.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/icons/app/tablex.png", "usr/share/icons/hicolor/512x512/apps/io.github.TableX.png", "644"],
    ["assets/icons/app/tablex-64.png", "usr/share/icons/hicolor/64x64/apps/io.github.TableX.png", "644"],
]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[lints.clippy]
# Table-driven tests spell their case tuples out inline; aliasing each one would hide the shape.
type_complexity = "allow"

# The completion menu is restyled in place (vendor/gpui-component/src/input/popovers/completion_menu.rs);
# the rest of the crate is the published 0.7.0.
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
