name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # main pushed together with a release tag: the tag run tests the same commit, so main skips
  tagged:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.t.outputs.tagged }}
    steps:
      # shortcut: misses a tag pushed after this runs, push both at once (git push --atomic origin main vX)
      - id: t
        run: |
          git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" 'v*' | grep -q "^$GITHUB_SHA" \
            && echo tagged=true >> "$GITHUB_OUTPUT" || true

  linux:
    needs: tagged
    # tagged is skipped off main; !cancelled() keeps that skip from skipping this job too
    if: ${{ !cancelled() && needs.tagged.outputs.tagged != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libvulkan-dev libfontconfig-dev libfreetype-dev libdbus-1-dev
      # rustup installs the version pinned in rust-toolchain.toml
      - run: rustup component add rustfmt clippy
      # only main saves: PR caches are unreadable elsewhere and evict main's from the 10 GB quota
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate desktop file and metainfo
        run: |
          sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate assets/icons/app/*.desktop
          appstreamcli validate --no-net assets/icons/app/*.metainfo.xml
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # compose, not a service container: the test server needs ssl=on and an init script
      - name: Start test Postgres
        run: |
          docker compose up -d
          # the entrypoint's init server has no TCP listener, so this passes only once the real one is up
          until docker compose exec -T postgres pg_isready -h localhost -U tablex; do sleep 1; done
      - run: cargo test --locked
        env:
          TABLEX_TEST_PG: postgres://tablex:tablex@localhost:55432/tablex

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        # 22.04 for Linux: binaries only run on distros with a glibc at least as new as the build's
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # a tag that disagrees with Cargo.toml or metainfo ships a binary reporting the wrong version
      - name: Tag matches versions
        shell: bash
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -qx "version = \"$v\"" Cargo.toml || { echo "::error::Cargo.toml version is not $v"; exit 1; }
          grep -q "<release version=\"$v\"" assets/icons/app/*.metainfo.xml || { echo "::error::metainfo has no <release version=\"$v\">"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no ## [$v] section"; exit 1; }
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libvulkan-dev libfontconfig-dev libfreetype-dev libdbus-1-dev
      # no rust-cache: a cache saved on a tag ref is unreadable by every later tag
      - run: cargo build --locked --release
      # tar keeps the executable bit, which upload-artifact drops
      - name: Package
        shell: bash
        run: |
          os=$(echo '${{ runner.os }}' | tr '[:upper:]' '[:lower:]')-$(echo '${{ runner.arch }}' | tr '[:upper:]' '[:lower:]')
          mkdir dist
          if [ '${{ runner.os }}' = Windows ]; then
            7z a "dist/tablex-$os.zip" ./target/release/tablex.exe
          elif [ '${{ runner.os }}' = Linux ]; then
            # desktop file and icons ride along for scripts/install.sh
            tar czf "dist/tablex-$os.tar.gz" -C target/release tablex \
              -C "$PWD/assets/icons/app" io.github.TableX.desktop tablex.png tablex-64.png
            cp scripts/install.sh dist/
          else
            tar czf "dist/tablex-$os.tar.gz" -C target/release tablex
          fi
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deb
      - name: Package deb and AppImage
        if: runner.os == 'Linux'
        run: |
          cargo deb --no-build --output dist/
          curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          # linuxdeploy takes the icon's file name as its name, and copies metainfo only from the AppDir
          cp assets/icons/app/tablex.png io.github.TableX.png
          install -Dm644 assets/icons/app/io.github.TableX.metainfo.xml AppDir/usr/share/metainfo/io.github.TableX.metainfo.xml
          # runners have no FUSE, so linuxdeploy (itself an AppImage) must extract to run
          APPIMAGE_EXTRACT_AND_RUN=1 LINUXDEPLOY_OUTPUT_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2) \
            ./linuxdeploy --appdir AppDir -e target/release/tablex \
            -d assets/icons/app/io.github.TableX.desktop -i io.github.TableX.png --output appimage
          mv TableX-*.AppImage dist/
      - uses: actions/upload-artifact@v4
        with:
          name: tablex-${{ runner.os }}
          path: dist/*

  release:
    needs: [linux, build]
    # the skipped tagged job upstream would skip this too under the implicit success()
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4   # CHANGELOG.md for the notes
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v=${GITHUB_REF_NAME#v}
          # the version's CHANGELOG section, up to the next ## heading or link refs
          awk -v h="## [$v]" 'index($0,h)==1{f=1;next} f&&(/^## /||/^\[/){exit} f' CHANGELOG.md > notes.md
          # a v1.2.0-rc.1 style tag is a prerelease and must not become "latest", which install.sh fetches
          case $v in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "TableX $v" --notes-file notes.md --verify-tag $pre
