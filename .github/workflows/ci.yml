name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libvulkan-dev libfontconfig-dev libfreetype-dev libdbus-1-dev
      # rustup installs the version pinned in rust-toolchain.toml
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # compose, not a service container: the test server needs ssl=on and an init script
      - name: Start test Postgres
        run: |
          docker compose up -d
          # the entrypoint's init server has no TCP listener, so this passes only once the real one is up
          until docker compose exec -T postgres pg_isready -h localhost -U queryx; do sleep 1; done
      - run: cargo test --locked
        env:
          QUERYX_TEST_PG: postgres://queryx:queryx@localhost:55432/queryx

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libvulkan-dev libfontconfig-dev libfreetype-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      # tar keeps the executable bit, which upload-artifact drops
      - name: Package
        shell: bash
        run: |
          os=$(echo '${{ runner.os }}' | tr '[:upper:]' '[:lower:]')-$(echo '${{ runner.arch }}' | tr '[:upper:]' '[:lower:]')
          if [ '${{ runner.os }}' = Windows ]; then
            7z a "queryx-$os.zip" ./target/release/queryx.exe
          else
            tar czf "queryx-$os.tar.gz" -C target/release queryx
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: queryx-${{ runner.os }}
          path: queryx-*.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
